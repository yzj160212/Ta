name: Windows 端编译检查

# 这台 Mac 上没有 .NET SDK，Windows 端口的改动只能靠这里验证。
# 范围刻意收敛：只编译并测试本次会改到的项目（Ta.OCR / Ta.Settings 及其测试），
# 不做打包 —— Windows 版仍是预览版，发行包走上游。
#
# Ta.Shell → Ta.LongSession 依赖 Microsoft.WindowsDesktop.App.Ref 里的
# UIAutomationClient；该 csproj 现在按已安装的 8.0.x ref pack 目录自动取路径，
# 不再依赖 $(BundledNETCoreAppPackageVersion)（在 runner 上与实装版本对不上）。
on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 编译与单元测试
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 查看工具链
        run: dotnet --info

      - name: 编译 OCR 与设置项目
        run: |
          dotnet build src/Ta.OCR/Ta.OCR.csproj -c Release --nologo
          dotnet build src/Ta.Settings/Ta.Settings.csproj -c Release --nologo

      - name: OCR 单元测试（含增强包清单解析）
        run: dotnet test tests/Ta.OCR.Tests/Ta.OCR.Tests.csproj -c Release --nologo

      - name: 设置项测试（含键名契约）
        run: dotnet test tests/Ta.Settings.Tests/Ta.Settings.Tests.csproj -c Release --nologo

      - name: 编译整个解决方案
        run: dotnet build Ta.sln -c Release --nologo

      - name: 诊断用：列出 WindowsDesktop 引用包
        if: always()
        continue-on-error: true
        run: |
          $root = Join-Path $env:ProgramFiles "dotnet\packs\Microsoft.WindowsDesktop.App.Ref"
          if (Test-Path $root) { Get-ChildItem $root | Select-Object -ExpandProperty Name } else { "ref pack 不存在: $root" }
        shell: pwsh